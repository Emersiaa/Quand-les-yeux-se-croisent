<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manuel de démarrage</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  h1.site-title {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 32px;
    opacity: .55;
    font-family: 'DM Mono', monospace;
  }

  /* ── Deck ── */
  .deck-wrap {
    position: relative;
    width: 100%;
    max-width: 720px;
    height: 400px;
  }

  .card {
    position: absolute;
    inset: 0;
    width: calc(100% - 52px);
    height: 100%;
    border-radius: 16px;
    padding: 44px 48px 40px;
    transition: transform .38s cubic-bezier(.4,0,.2,1), box-shadow .38s;
    display: flex;
    flex-direction: column;
  }

  .card.active  { transform: translateX(0)   scale(1);    z-index: 10; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .card.behind  { transform: translateX(16px) scale(.972); z-index: 5;  box-shadow: none; pointer-events:none; }
  .card.behind2 { transform: translateX(28px) scale(.944); z-index: 1;  box-shadow: none; pointer-events:none; }
  .card.hidden  { transform: translateX(40px) scale(.916); z-index: 0;  box-shadow: none; pointer-events:none; opacity:.4; }

  /* card content */
  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .card-section {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.18);
    color: rgba(255,255,255,.8);
  }
  .card-step {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,.45);
    letter-spacing: .06em;
    margin-left: auto;
  }
  .card-title {
    font-size: 26px;
    font-weight: 500;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 14px;
  }
  .card-desc {
    font-size: 14px;
    color: rgba(255,255,255,.65);
    line-height: 1.7;
    margin-bottom: 22px;
  }
  .card-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1;
  }
  .card-list li {
    font-size: 13.5px;
    color: rgba(255,255,255,.8);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.5;
  }
  .card-list li::before {
    content: '';
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    margin-top: 7px;
    flex-shrink: 0;
  }

  /* nav buttons */
  .card-nav {
    display: flex;
    gap: 8px;
    margin-top: auto;
    padding-top: 24px;
  }
  .card-nav button {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 7px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.85);
    cursor: pointer;
    transition: background .15s;
  }
  .card-nav button:hover { background: rgba(255,255,255,.22); }
  .card-nav button:disabled { opacity: .3; cursor: default; }

  /* ── Tabs ── */
  .tabs {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    width: 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    z-index: 20;
    padding: 8px 0;
  }
  .tab {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: rgba(255,255,255,.7);
    transition: all .2s;
    margin-left: auto;
    position: relative;
  }
  .tab:hover { width: 38px; color: #fff; }
  .tab.active-tab { width: 44px; color: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.3); }
  .tab .tip {
    position: absolute;
    right: 110%;
    background: rgba(0,0,0,.8);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    white-space: nowrap;
    padding: 4px 10px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .tab:hover .tip { opacity: 1; }

  /* ── Progress bar ── */
  .progress-wrap {
    width: 100%;
    max-width: 720px;
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,.12);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: rgba(255,255,255,.5);
    transition: width .35s;
  }
  .progress-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,.35);
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1 class="site-title">Manuel de démarrage</h1>

<div class="deck-wrap" id="deck">
  <div class="tabs" id="tabs"></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  <span class="progress-label" id="prog-label"></span>
</div>

<script>
/* ============================================================
   CONTENU — modifie uniquement ce tableau pour personnaliser
   ============================================================ */
const slides = [
  {
    color: "#C0473F",
    section: "Installation",
    title: "Prérequis système",
    desc: "Vérifie que ton environnement est compatible avant de commencer.",
    items: [
      "OS : Windows 10+, macOS 12+, Ubuntu 20.04+",
      "RAM minimum : 8 Go",
      "Accès administrateur requis"
    ]
  },
  {
    color: "#C96A30",
    section: "Installation",
    title: "Téléchargement",
    desc: "Récupère la bonne version sur le portail interne.",
    items: [
      "Aller sur le portail interne",
      "Choisir la version stable (LTS)",
      "Vérifier le hash SHA-256"
    ]
  },
  {
    color: "#B8860B",
    section: "Installation",
    title: "Installation",
    desc: "Lance l'installateur et suis les étapes guidées.",
    items: [
      "Exécuter en tant qu'administrateur",
      "Choisir le dossier d'installation",
      "Cocher 'Ajouter au PATH'"
    ]
  },
  {
    color: "#4A8C5C",
    section: "Configuration",
    title: "Première ouverture",
    desc: "Démarre l'application et entre ta licence.",
    items: [
      "Double-cliquer sur l'icône",
      "Accepter les conditions d'utilisation",
      "Entrer la clé de licence"
    ]
  },
  {
    color: "#2E8B8B",
    section: "Configuration",
    title: "Connexion au serveur",
    desc: "Relie l'outil au serveur de ton organisation.",
    items: [
      "Ouvrir Paramètres > Réseau",
      "Saisir l'URL du serveur interne",
      "Tester la connexion"
    ]
  },
  {
    color: "#3A6FA8",
    section: "Configuration",
    title: "Authentification",
    desc: "Configure ton accès SSO ou compte local.",
    items: [
      "SSO recommandé pour les équipes",
      "Contacter IT pour les identifiants",
      "Activer l'authentification 2FA"
    ]
  },
  {
    color: "#5A4EBF",
    section: "Utilisation",
    title: "Préférences",
    desc: "Personnalise l'interface selon tes besoins.",
    items: [
      "Langue : Français ou Anglais",
      "Thème clair / sombre",
      "Configurer les notifications"
    ]
  },
  {
    color: "#7A4A9A",
    section: "Utilisation",
    title: "Interface principale",
    desc: "Découvre les zones clés de l'écran.",
    items: [
      "Barre de navigation (gauche)",
      "Panneau principal (centre)",
      "Panneau de propriétés (droite)"
    ]
  },
  {
    color: "#8B5E3C",
    section: "Utilisation",
    title: "Créer un projet",
    desc: "Démarre un nouveau fichier de travail.",
    items: [
      "Fichier > Nouveau projet",
      "Nommer et choisir le gabarit",
      "Sauvegarder (Ctrl+S)"
    ]
  },
  {
    color: "#4A7A4A",
    section: "Utilisation",
    title: "Raccourcis clés",
    desc: "Les commandes essentielles à mémoriser.",
    items: [
      "Ctrl+Z : annuler",
      "Ctrl+Shift+P : palette de commandes",
      "F5 : exécuter / rafraîchir"
    ]
  },
  {
    color: "#7A6014",
    section: "Admin",
    title: "Gestion des utilisateurs",
    desc: "Ajouter ou retirer des membres de l'équipe.",
    items: [
      "Admin > Gestion des comptes",
      "Inviter par courriel",
      "Définir les rôles (lecteur / éditeur / admin)"
    ]
  },
  {
    color: "#6B3A3A",
    section: "Admin",
    title: "Résolution de problèmes",
    desc: "Que faire en cas d'erreur ou de blocage.",
    items: [
      "Consulter les logs dans /logs",
      "Redémarrer le service",
      "Contacter le support avec le code d'erreur"
    ]
  },
];
/* ============================================================ */

let current = 0;
const deck  = document.getElementById('deck');
const tabsEl = document.getElementById('tabs');

function getClass(idx) {
  const d = idx - current;
  const n = slides.length;
  const diff = ((d % n) + n) % n;
  if (diff === 0) return 'active';
  if (diff === 1) return 'behind';
  if (diff === 2) return 'behind2';
  return 'hidden';
}

function build() {
  deck.querySelectorAll('.card').forEach(c => c.remove());

  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'card ' + getClass(i);
    div.style.background = s.color;

    div.innerHTML = `
      <div class="card-meta">
        <span class="card-section">${s.section}</span>
        <span class="card-step">${i + 1} / ${slides.length}</span>
      </div>
      <div class="card-title">${s.title}</div>
      <div class="card-desc">${s.desc}</div>
      <ul class="card-list">
        ${s.items.map(it => `<li>${it}</li>`).join('')}
      </ul>
      <div class="card-nav">
        <button onclick="go(${i - 1})" ${i === 0 ? 'disabled' : ''}>← Précédent</button>
        <button onclick="go(${i + 1})" ${i === slides.length - 1 ? 'disabled' : ''}>Suivant →</button>
      </div>`;

    deck.insertBefore(div, tabsEl);
  });

  buildTabs();
  updateProgress();
}

function buildTabs() {
  tabsEl.innerHTML = '';
  slides.forEach((s, i) => {
    const t = document.createElement('div');
    t.className = 'tab' + (i === current ? ' active-tab' : '');
    t.style.background = s.color;
    t.innerHTML = `${i + 1}<span class="tip">${s.title}</span>`;
    t.onclick = () => go(i);
    tabsEl.appendChild(t);
  });
}

function updateProgress() {
  const pct = Math.round((current + 1) / slides.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = (current + 1) + ' / ' + slides.length;
}

function go(idx) {
  if (idx < 0 || idx >= slides.length) return;
  current = idx;
  build();
}

build();
</script>
</body>
</html>
